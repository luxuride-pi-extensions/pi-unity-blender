name: ci

on:
  push:
    # Every branch `git branch -a` currently shows, and no others. This list
    # was [master] alone, which meant nothing ran for the branch all four
    # repos were actually developed on: `feat/packaging` sat fully pushed
    # and no CI run had ever existed for its head. Do NOT "tidy" this back
    # to [master] -- that is the exact shape of the finding.
    #
    #   master
    #     the release branch; its run is the pre-merge gate.
    #   feat/packaging
    #     the packaging lane, in flight across all four repos (the `files`
    #     lists and release.yml).
    #   fix/ci-checkout-order
    #     the lane that established this repo's checkout order, which is
    #     load-bearing -- see the checkout comment in the `agreement` job.
    #   fix/review-findings
    #     the review-findings lane this fix belongs to.
    #   ci/github-actions
    #     the lane that stands up the GitHub Actions workflow itself, so
    #     its changes need a runner to judge.
    #
    # When a lane is added, add it here. The check is one command:
    #   git branch -a --format='%(refname:short)' | grep -v HEAD
    branches:
      - master
      - feat/packaging
      - fix/ci-checkout-order
      - fix/review-findings
      - ci/github-actions
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The only job here used to be
  #     if: ${{ vars.CONSUMER_REPOS_ENABLED == '1' }}
  # `vars` is a repository VARIABLE, not a secret. It happens to be set to '1'
  # here today, and nothing in the repository says so -- no workflow, script or
  # doc sets or reads it, and `gh api .../actions/variables` is the only place
  # the value exists. Unset it, or clone this file to a repo that never had it,
  # and every run of this workflow reports SUCCESS having executed zero jobs:
  # the most dangerous failure mode in the suite, because a green tick on a
  # check that never ran is indistinguishable from a green tick on a check
  # that passed.
  #
  # Nor was the gate a reason to gate. A job-level `if` cannot read `secrets`
  # at all (only github/needs/vars/inputs are in scope), so the real condition
  # -- "does this runner have CONSUMER_TOKEN" -- is not expressible as a job
  # `if`, and expressing a proxy for it as a VARIABLE is what put the whole
  # suite behind something nobody could see from the file. A condition a step
  # can read is a condition a step can enforce.
  #
  # Neither job is gated now, and between them they cover every check that
  # used to live behind the variable:
  #
  #   unit        runs always, with no PAT. `tsc --noEmit` reads this repo's
  #               own sources and needs nothing else. It is the one check in
  #               this repository that a bare checkout can actually complete,
  #               and that is not a guess: every .ts module here loads
  #               manager-core.ts, which THROWS when the core is not installed
  #               (manager-core.ts:257-264, by design -- a silent fallback is
  #               the drift pi-manager-core exists to prevent), so with no
  #               sibling present even test/parse-summary.mjs dies on import.
  #   agreement   runs always, and fails on its FIRST step when
  #               CONSUMER_TOKEN is missing. It needs the token because
  #               test/manager-prompt.mjs composes this repo's manager prompt
  #               out of pi-blender's and pi-unity-vrchat's and asserts the halves
  #               agree on the Blender-side contract; without the extensions
  #               installed it reports 11 passed and 4 FAILED (both side
  #               bodies missing, plus a load-failure notice the run is not
  #               supposed to emit).
  #
  # The guard is a STEP rather than a job `if` on purpose. A job-level `if`
  # turns missing setup into a SKIPPED job, which renders as green; a failing
  # first step turns the same missing setup into a FAILED job naming the
  # secret it wanted. So the possible outcomes are: the checks run and pass,
  # the checks run and fail, or the run is red saying which secret is
  # missing. There is no fourth outcome in which the workflow is green and
  # nothing was verified.

  unit:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # --legacy-peer-deps: peerDependencies { "pi-manager-core": "*" } is
      # the documented shape for a Pi package (docs/packages.md) and is
      # loaded from the extensions directory, never from the registry, so a
      # plain `npm ci` 404s on a package that was never published.
      #
      # The install is not optional here either, and the failure it prevents
      # does not read like a missing install: `tsc --noEmit` reads
      # compilerOptions.types: ["node"] against node_modules/@types, so with
      # no node_modules at all it reports
      #
      #   error TS2688: Cannot find type definition file for 'node'.
      #   The file is in the program because:
      #     Entry point of type library 'node' specified in compilerOptions
      #
      # which points at tsconfig rather than at the install that was skipped.
      - name: install
        run: npm ci --legacy-peer-deps

      # This job deliberately does NOT try to run the test suites. See the
      # note above about loadManagerCore() throwing on import: on a runner
      # with no pi-manager-core checkout, every suite in test/ fails before
      # its first assertion, which is a red run that says "install the
      # core" rather than anything about this repository. The suites run in
      # `agreement`, where the core is present.
      - name: typecheck
        run: npm run typecheck

  agreement:
    name: manager-prompt cross-repo agreement
    runs-on: ubuntu-latest
    steps:
      # FIRST, and before anything else, so a run with no PAT is a short
      # failure naming the secret rather than a checkout error 90 lines into
      # the log. This step replaces what the job-level `if` used to do.
      - name: the sibling checkouts need CONSUMER_TOKEN
        env:
          # Passed through the environment, never interpolated into the
          # shell body: a PAT in a `run:` line is a PAT in the log.
          CONSUMER_TOKEN: ${{ secrets.CONSUMER_TOKEN }}
        run: |
          set -euo pipefail
          # `:-` rather than plain $CONSUMER_TOKEN because `set -u` treats a
          # secret that was never created as an error, and the error a user
          # should read is the paragraph below, not "unbound variable".
          if [ -z "${CONSUMER_TOKEN:-}" ]; then
            {
              echo "CONSUMER_TOKEN is not set, so pi-blender and pi-unity-vrchat"
              echo "cannot be checked out and the cross-repo check cannot"
              echo "run. test/manager-prompt.mjs asserts that this"
              echo "repository's manager prompt and pi-blender's agree on"
              echo "who briefs whom and what a stop condition is; with a"
              echo "side extension absent it reports 11 passed and 4 FAILED,"
              echo "and there is no way to run it without the siblings."
              echo
              echo "This step FAILS rather than skipping the job, because a"
              echo "skipped job renders as a green tick."
              echo
              echo "To fix: add CONSUMER_TOKEN as a repository secret -- a"
              echo "PAT with read access to this org. github.token cannot"
              echo "read a PRIVATE repository, and every repository in this"
              echo "org is PRIVATE."
            } >&2
            exit 1
          fi

      # This repository lands in a subdirectory, so $GITHUB_WORKSPACE is itself
      # a projects/ directory holding all four checkouts.
      # THIS REPOSITORY FIRST, ON PURPOSE, AND NOT BY ACCIDENT.
      #
      # actions/checkout runs `clean: true`, which deletes the CONTENTS OF
      # $GITHUB_WORKSPACE before it clones. $GITHUB_WORKSPACE is the default
      # path (an empty `path:`), so with the sibling checkouts already at
      # projects/*, this step wipes every one of them -- and the run then dies
      # a step later with
      #
      #   error: An error occurred trying to start process '/usr/bin/bash'
      #   with working directory '.../projects/pi-manager-core'.
      #   No such file or directory
      #
      # which reads like a checkout that never happened and is actually one
      # that was deleted. Every sibling checkout must therefore come AFTER this
      # step.
      - uses: actions/checkout@v5
      # pi-manager-core next, so this repository lands in a subdirectory and
      # the sibling checkouts can go beside it -- the layout
      # resolver-copies.mjs and allowlists.mjs look for, and the layout these
      # four repos have in a working directory.
      - uses: actions/checkout@v5
        with:
          repository: luxuride-pi-extensions/pi-manager-core
          ref: master
          path: projects/pi-manager-core
          # github.token cannot read a PRIVATE repository, and every repository
          # in this org is PRIVATE. A PAT with read access to the org.
          token: ${{ secrets.CONSUMER_TOKEN }}

      - uses: actions/checkout@v5
        with:
          repository: luxuride-pi-extensions/pi-blender
          ref: master
          path: projects/pi-blender
          token: ${{ secrets.CONSUMER_TOKEN }}

      # pi-unity-vrchat's manager prompt is half of what this repository's is composed
      # from, so a runner has to have it or the check below has nothing to
      # compare against.
      - uses: actions/checkout@v5
        with:
          repository: luxuride-pi-extensions/pi-unity-vrchat
          ref: master
          path: projects/pi-unity-vrchat
          token: ${{ secrets.CONSUMER_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # The core's own dependency install, and not just its files: jiti is a
      # transitive dependency of @earendil-works/pi-coding-agent, so this is
      # the only place on a clean runner where the loader these tests need
      # exists.
      - name: install the manager core
        working-directory: projects/pi-manager-core
        run: npm ci

      # --legacy-peer-deps: all three consumers declare
      # peerDependencies: { "pi-manager-core": "*" }, which is the documented
      # shape for a Pi package (docs/packages.md) -- loaded from the extensions
      # directory, not installed from the registry -- so plain `npm ci` fails
      # with 404 on a package that was never published.
      - name: install the extensions and this repository
        run: |
          # NOT pi-unity-blender: this repository's own checkout IS
          # projects/pi-unity-blender. Naming it here as well made the loop
          # `cd projects/pi-unity-blender` in a shell whose working directory
          # was the workspace root, and the runner reported
          # `cd: projects/pi-unity-blender: No such file or directory` -- the
          # path is relative, so it only resolves from the root.
          for repo in pi-blender pi-unity-vrchat; do
            (cd "projects/$repo" && npm ci --legacy-peer-deps)
          done
          # This repository IS projects/pi-unity-blender, so it needs the same
          # install from the workspace root rather than through the loop above.
          # Omitting it was not caught by the typecheck passing, because
          # `tsc --noEmit` reads `compilerOptions.types: ["node"]` against
          # node_modules/@types -- and with no node_modules at all that is
          #
          #   error TS2688: Cannot find type definition file for 'node'.
          #   The file is in the program because:
          #     Entry point of type library 'node' specified in compilerOptions
          #
          # which reads like a broken tsconfig rather than a missing install.
          npm ci --legacy-peer-deps

      # test/manager-prompt.mjs reads the extensions INSTALLED under
      # PI_AGENT_DIR, not from sibling checkouts: a checkout that is not
      # installed is a silently shorter prompt, and the suite reports that as a
      # missing section rather than as a load failure.
      #
      # The names are the ones pi installs under, which are not the repo names:
      # the binder extension is "unity-blender", and pi's own resolver probes
      # both "manager-core" and "pi-manager-core" when a consumer looks for it.
      - name: link the extensions into an agent dir
        run: |
          agent="$RUNNER_TEMP/agent-dir/extensions"
          mkdir -p "$agent"
          w="$GITHUB_WORKSPACE/projects"
          ln -s "$w/pi-unity-vrchat"         "$agent/pi-unity-vrchat"
          ln -s "$w/pi-blender"       "$agent/pi-blender"
          ln -s "$w/pi-manager-core"  "$agent/manager-core"
          ln -s "$w/pi-unity-blender" "$agent/unity-blender"

      - name: typecheck and test
        env:
          PI_AGENT_DIR: ${{ runner.temp }}/agent-dir
          PI_INSTALL_DIR: ${{ runner.temp }}/agent-dir/install
        run: |
          npm run typecheck
          npm test
